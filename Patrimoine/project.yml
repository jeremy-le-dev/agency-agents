name: Patrimoine
options:
  bundleIdPrefix: com.patrimoine
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  Patrimoine:
    type: application
    platform: iOS
    sources:
      - path: Patrimoine
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrimoine.app
        INFOPLIST_KEY_CFBundleDisplayName: Patrimoine
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSFaceIDUsageDescription: "Patrimoine utilise Face ID pour protéger l'accès à vos données financières."
        CODE_SIGN_ENTITLEMENTS: Patrimoine/Patrimoine.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    info:
      path: Patrimoine/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLName: com.patrimoine.powens
            CFBundleURLSchemes:
              - patrimoine
    entitlements:
      path: Patrimoine/Patrimoine.entitlements

  PatrimoineWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: PatrimoineWidget
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.patrimoine.app.widget
        INFOPLIST_KEY_CFBundleDisplayName: Patrimoine Widget
        INFOPLIST_KEY_NSHumanReadableCopyright: ""
        CODE_SIGN_ENTITLEMENTS: PatrimoineWidget/PatrimoineWidget.entitlements
    entitlements:
      path: PatrimoineWidget/PatrimoineWidget.entitlements
    dependencies:
      - target: Patrimoine

schemes:
  Patrimoine:
    build:
      targets:
        Patrimoine: all
        PatrimoineWidget: all
    run:
      config: Debug
    archive:
      config: Release
